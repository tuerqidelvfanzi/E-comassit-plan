name: 插件任务 (A)
description: extension/ 采集、上传、发布填表
title: "[ext] "
labels:
  - extension
body:
  - type: markdown
    attributes:
      value: |
        负责人：**A · 插件** · 目录 `extension/` only
        契约：`docs/COLLECT_SCHEMA.md`
  - type: checkboxes
    id: scope
    attributes:
      label: 范围
      options:
        - label: 1688 适配
        - label: 淘宝/天猫 适配
        - label: Popup / Background
        - label: 上传 / collect-jobs
        - label: 发布草稿填表
  - type: textarea
    id: sample-json
    attributes:
      label: 联调样例 NormalizedProduct（合并时必填）
      description: 粘贴一条真实采集 JSON（可脱敏）
  - type: checkboxes
    id: checklist
    attributes:
      label: 完成检查
      options:
        - label: 输出符合 normalized-product.schema.json v1.0.0
        - label: 未修改 web/（非契约 PR）
        - label: 已 npm run zip:extension（若改 extension）
