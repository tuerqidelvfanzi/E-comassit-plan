<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>商品选品助手</title>
    <script>
      (function () {
        var valid = ['browser', 'solarized', 'cyberpunk', 'jade', 'sunlight', 'sunset', 'parchment', 'custom'];
        var t = localStorage.getItem('psa_theme');
        if (valid.indexOf(t) === -1) t = 'browser';
        document.documentElement.setAttribute('data-theme', t);
        if (t === 'custom') {
          var css = localStorage.getItem('psa_theme_custom_css');
          if (css) {
            var s = document.createElement('style');
            s.id = 'psa-custom-theme';
            s.textContent = css;
            document.head.appendChild(s);
          }
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
