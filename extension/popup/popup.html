<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>电商助手</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <strong>电商助手</strong>
      <span class="badge demo">演示 v0.3</span>
    </header>

    <section class="field">
      <label for="app-base">后台地址</label>
      <input id="app-base" type="url" placeholder="https://tuerqidelvfanzi.github.io/E-comassit-plan" />
    </section>

    <section>
      <p class="hint">步骤 2：在已登录的商品页采集</p>
      <button type="button" id="btn-capture" class="primary">采集当前页</button>
      <button type="button" id="btn-link" class="secondary">粘贴链接采集</button>
    </section>

    <section class="preview hidden" id="preview">
      <h2>采集预览</h2>
      <p id="preview-title"></p>
      <p class="meta" id="preview-meta"></p>
      <button type="button" id="btn-upload" class="primary">上传到采集箱</button>
    </section>

    <section>
      <h2>步骤 4：发布草稿</h2>
      <select id="platform">
        <option value="shopee">Shopee 草稿</option>
        <option value="tiktok">TikTok Shop 草稿</option>
        <option value="taobao">淘宝草稿</option>
      </select>
      <button type="button" id="btn-publish" class="secondary">填入当前卖家后台页</button>
      <p class="hint">步骤 5：在目标网站草稿页内点击「发布」</p>
    </section>

    <footer>
      <a id="link-inbox" href="#" target="_blank" rel="noopener">打开采集箱后台</a>
    </footer>
    <script src="popup.js"></script>
  </body>
</html>
